[mgr]
ratio = [1, 4, 4]
linemode = "size"

[preview]
wrap = "yes"

[opener]
edit = [
    { run = "nvim %s", block = true, orphan = true },
]

edit_dir = [
    { run = "nvim %d", block = true, orphan = true, desc = "Nvim in directory"}
]

[open]
rules = [
    { url = "*/", use = ["edit", "edit_dir", "open", "reveal"] },
    { mime = "text/*", use = ["edit", "edit_dir", "reveal"] },
    { mime = "image/*", use = ["open", "reveal"] },
    { mime = "{audio,video}/*", use = ["play", "reveal"] },
    { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = ["edit", "reveral"]},
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "reveal"] },
    { mime = "inode/empty", use = ["edit", "reveal"] },
    { mime = "vfs/{absent,stale}", use = "download" },
    { url = "*", use = ["open", "reveal"] },
]
